name: Validate public packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; official tag checked 2026-10-02
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run focused tests
        run: python3 -m unittest discover -s tests
      - name: Check public source
        run: python3 scripts/check_public.py
      - name: Build the locked public templates
        run: python3 scripts/build.py --output-dir dist
      - name: Validate public templates
        run: python3 scripts/validate.py dist --allow-template
      - name: Validate the committed packages
        run: python3 scripts/validate.py packages --allow-template
      - name: Check that committed outputs match the source
        run: diff -qr packages dist
      - name: Upload public templates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-plugin-templates
          path: |
            dist/local/
            dist/cloud/
          if-no-files-found: error
          # These two validated public directories contain required dotfiles.
          include-hidden-files: true
          retention-days: 14
